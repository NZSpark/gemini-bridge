name: CI

# 只跑**不联网**的套件：全部用假 page / 假 driver / TestClient，不需要浏览器，
# 也不需要 Gemini 登录态。真实 E2E（tests/e2e/）由 GEMINI_E2E=1 本地开启，
# CI 不设置该变量，因此会被 unittest.skipUnless 全部跳过（这正是 T8.5 的要求）。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # 测试专用依赖（httpx2 供 starlette TestClient 使用）
          python -m pip install pytest httpx2
      - name: 单元 / 回归套件
        run: python -m pytest -q
